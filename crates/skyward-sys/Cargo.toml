[package]
name = "skyward-sys"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
skyward-block = { path = "../skyward-block" }

# The clock, the control socket and the properties are the kernel's and
# the system's: libc is the phone's, listed among the phone's.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
