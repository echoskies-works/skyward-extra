[package]
name = "skyward-lp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
sha2 = "0.10.9"
zerocopy = { version = "0.8.63", features = ["derive"] }

# A super is a file long past what is written of it: a test marks the one
# it lays out sparse, which Windows keeps only when asked.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO"] }
